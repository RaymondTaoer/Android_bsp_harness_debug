# 一个真实落地实例：RK3562 / Android 13 BSP（7 个隔离 codegraph 库）
#
# 这是 `harness.conf` 的实例，不是默认值。复制到 <树>/features/harness.conf 后按需改。
# 该树的实测规模（2026-10）：kernel-5.10 49916 文件、packages 20638 java 等。

HARNESS_TREE=""

ROOTS=(
  "kernel-5.10"
  "frameworks"
  "system"
  "hardware"
  "vendor"
  "device/rockchip"
  "packages"
)

ALIASES=(
  "kernel=kernel-5.10"
)

EXCLUDE_DIR_CANDIDATES=(
  "out" "output" "build" ".out" "obj" "gen" "generated"
  "prebuilts" "third_party" "node_modules" ".gradle" ".cache"
  "test" "tests" "testing" "vts" "cts" "samples" "demo" "benchmarks"
  "docs" "documentation"
)

EXCLUDE_FILE_PATTERNS=(
  "**/*.o" "**/*.a" "**/*.so" "**/*.d" "**/*.cmd" "**/*.mod.c"
  "**/*.min.js" "**/*.min.css" "**/*.pb.cc" "**/*.pb.h"
  "**/*_gen.cpp" "**/*_gen.h" "**/*.gcda" "**/*.gcno"
)

# kernel 只保留 arm64，其余架构的驱动源码对 RK3562 无查询价值（该树实测 49916 文件中
# 大量是 arch/* 下的非目标架构）。注意：EXTRA_EXCLUDE 是**无条件**写入的，
# 所以这里的架构目录在该树里必须真实存在，否则说明换了树、要重新生成。
EXTRA_EXCLUDE=(
  "arch/alpha/**"
  "arch/arc/**"
  "arch/arm64/configs/**"
  "arch/csky/**"
  "arch/h8300/**"
  "arch/hexagon/**"
  "arch/ia64/**"
  "arch/m68k/**"
  "arch/microblaze/**"
  "arch/mips/**"
  "arch/nds32/**"
  "arch/nios2/**"
  "arch/openrisc/**"
  "arch/powerpc/**"
  "arch/riscv/**"
  "arch/s390/**"
  "arch/sh/**"
  "arch/sparc/**"
  "arch/um/**"
  "arch/x86/**"
  "arch/xtensa/**"
  "samples/**"
  "scripts/**"
  "tools/**"
  "Documentation/**"
)

EXCLUDE_SCAN_DEPTH_DIR=3
EXCLUDE_SCAN_DEPTH_FILE=4

CODEGRAPH_MIN_VERSION="1.6.2"
CODEGRAPH_MCP_TARGETS=""
BUILD_SERIAL=1
